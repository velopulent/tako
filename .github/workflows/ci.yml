name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  ACTIONLINT_VERSION: 1.7.7
  REDOCLY_CLI_VERSION: 1.34.0
  STATICCHECK_VERSION: 2026.1

# All jobs run in parallel with no `needs:` edges for fast failure.
# No per-job path filtering: shared files (package.json, bun.lock, nx.json,
# Go workspace/module files, .github/**, tools/**, packaging/**) can affect
# several apps, so every job always runs. Predictable over clever.
# Runner count per normal PR: 7 (was 3). distro-tags loops 7 tags in one
# runner instead of a 7-way matrix; true distro package builds stay in
# native-packages.yml / release.yml, not PR CI.
jobs:
  repo-validation:
    name: Repo validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Lint OpenAPI
        run: bunx --bun @redocly/cli@${{ env.REDOCLY_CLI_VERSION }} lint --config .redocly.yaml apps/backend/api/openapi.yaml
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          arch=$(uname -m)
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          bindir="${RUNNER_TEMP}/bin"
          mkdir -p "$bindir"
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${arch}.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$bindir" actionlint
          echo "$bindir" >> "$GITHUB_PATH"
      - run: actionlint
      - name: Run shellcheck
        run: |
          set -euo pipefail
          # ubuntu-24.04 images already ship shellcheck; never run
          # apt-get update just for this. Fall back to install only when
          # the preinstalled tool is genuinely absent.
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi
          shellcheck --severity=error \
            tools/package \
            tools/package-check \
            tools/tako-go.sh \
            tools/tako-host-test \
            tools/tako-integration \
            apps/backend/packaging/*.sh \
            apps/backend/packaging/scripts/deb/*.sh \
            apps/backend/packaging/scripts/rpm/*.sh \
            apps/backend/packaging/scripts/arch/*.sh
      - name: Check shell syntax
        run: |
          set -euo pipefail
          for script in \
            tools/package \
            tools/package-check \
            tools/tako-go.sh \
            apps/backend/packaging/scripts/test.sh \
            apps/backend/packaging/scripts/deb/*.sh \
            apps/backend/packaging/scripts/rpm/*.sh \
            apps/backend/packaging/scripts/arch/*.sh; do
            sh -n "$script"
          done
          for script in \
            tools/tako-host-test \
            tools/tako-integration \
            apps/backend/packaging/smoke-test.sh \
            apps/backend/packaging/lifecycle-test.sh; do
            bash -n "$script"
          done

  backend-ubuntu:
    name: Backend (ubuntu, authoritative)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAKO_DISTRO: ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-backend
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            go.work.sum
      - name: Run Go race tests with coverage
        working-directory: apps/backend
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/coverage/go"
          ../../tools/tako-go.sh test -race -covermode=atomic \
            -coverprofile="$GITHUB_WORKSPACE/coverage/go/coverage.out" ./...
          go tool cover -func="$GITHUB_WORKSPACE/coverage/go/coverage.out" \
            | tee "$GITHUB_WORKSPACE/coverage/go/coverage.txt"
          go tool cover -html="$GITHUB_WORKSPACE/coverage/go/coverage.out" \
            -o "$GITHUB_WORKSPACE/coverage/go/coverage.html"
      - name: Upload Go coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage/go/
          if-no-files-found: warn
          retention-days: 14
      - name: Run go vet
        working-directory: apps/backend
        run: ../../tools/tako-go.sh vet ./...
      - name: Install staticcheck
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Run staticcheck
        working-directory: apps/backend
        run: staticcheck -checks=all,-U1000,-SA1019,-S1017,-S1016,-ST1000,-ST1020 -tags ubuntu ./...

  distro-tags:
    name: Distro tags
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-backend
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            go.work.sum
      - name: Validate every distro build tag on one host
        working-directory: apps/backend
        run: |
          set -euo pipefail
          # Same Ubuntu host for all tags: validates tag-gated Go code
          # compiles and unit tests pass per distro. Not true distro
          # environments; real package/install testing stays in
          # native-packages.yml. Ubuntu is excluded here: backend-ubuntu
          # (race, coverage, vet, staticcheck) and build already cover it.
          # No race, coverage, or staticcheck here; backend-ubuntu remains
          # the authoritative quality job. `go list` is omitted: vet, test,
          # and build each resolve the full package graph for the selected
          # tag, so list would prove nothing extra.
          # No tag needs runner isolation: each tako-go.sh invocation is a
          # fresh `go` process with its own -tags value, no daemon or
          # filesystem state leaks between iterations.
          for tag in debian fedora rhel rocky almalinux opensuse archlinux; do
            echo "--- TAKO_DISTRO=$tag ---"
            TAKO_DISTRO="$tag" ../../tools/tako-go.sh vet ./...
            TAKO_DISTRO="$tag" ../../tools/tako-go.sh test ./...
            TAKO_DISTRO="$tag" ../../tools/tako-go.sh build ./...
          done
      - name: Verify untagged build fails on the distro guard
        working-directory: apps/backend
        run: |
          set -euo pipefail
          # updates_tag_required.go references undefined
          # distro_build_tag_required so a build without a supported tag
          # fails. Assert the guard reason, not just any failure.
          set +e
          output=$(go build ./... 2>&1)
          build_status=$?
          set -e
          if [ "$build_status" -eq 0 ]; then
            echo "expected untagged backend build to fail" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -Fq 'distro_build_tag_required'; then
            echo "untagged build failed, but not because of the distro-tag guard:" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          echo "untagged build correctly rejected: distro_build_tag_required"

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/dashboard vitest run --coverage
      - name: Upload dashboard coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-coverage
          path: apps/dashboard/coverage/
          if-no-files-found: warn
          retention-days: 14
      - run: bun nx typecheck dashboard
      - run: bun nx lint dashboard
      # No production build here. The dashboard production build runs exactly
      # once in the build job via `nx build backend` (dependsOn ^build).
      # Separate runners share no local Nx cache, so building here too would
      # mean building twice with no benefit.

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun nx lint web
      # Typecheck runs through the build target's dependsOn graph, not as a
      # separate step.
      - run: bun nx build web

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAKO_DISTRO: ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-backend
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            go.work.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Builds the dashboard production bundle exactly once (via ^build)
      # then the backend binary with embedded dashboard. Ubuntu tag only;
      # other tags are compile-checked in distro-tags.
      - run: bun run build

  packaging-validation:
    name: Packaging validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAKO_DISTRO: ubuntu
    steps:
      # Both setups are load-bearing: package:check probes PAM headers via
      # cc -lpam and runs systemd-analyze verify (setup-linux-backend), and
      # reads `go env` (CGO_ENABLED, GOARCH) plus `goreleaser check` (setup-go
      # plus GoReleaser below). It compiles no Go code itself.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-linux-backend
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            go.work.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v${{ vars.GORELEASER_VERSION || '2.18.0' }}"
          install-only: true
      # package:check runs goreleaser check, manifest cross-checks,
      # systemd-analyze verify, plus mocked maintainer-script and host
      # tests. Safe for PR CI. Full snapshot builds, native Docker
      # package builds, and tools/tako-integration stay in release-only
      # workflows.
      - run: bun run package:check
