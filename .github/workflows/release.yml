name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Validate tag and resolve release type
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != push ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${{ github.ref_name }}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "tag $tag does not match vMAJOR.MINOR.PATCH[-suffix]" >&2
            exit 1
          fi
          if printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: Required CI
    uses: ./.github/workflows/ci.yml

  native-packages:
    name: Native packages
    needs: ci
    uses: ./.github/workflows/native-packages.yml

  publish:
    name: Assemble and publish
    needs: [native-packages, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: incoming
      - name: Assemble every manifest package
        run: bun tools/release-assemble incoming release
      - name: Generate release checksums
        working-directory: release
        run: |
          set -euo pipefail
          checksums_tmp=$(mktemp)
          trap 'rm -f "$checksums_tmp"' EXIT
          find . -maxdepth 1 -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$checksums_tmp"
          mv "$checksums_tmp" checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
