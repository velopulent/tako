      - { src: apps/backend/packaging/branding/opensuse.png, dst: /usr/share/tako/branding/opensuse.png }

  - id: arch-package
    ids: [archlinux]
    package_name: tako
    formats: [archlinux]
    file_name_template: "tako_{{ .Version }}_archlinux_{{ .Arch }}"
    bindir: /usr/bin
    vendor: Velopulent
    homepage: https://tako.velopulent.com
    maintainer: Tako maintainers
    description: Linux administration dashboard
    license: AGPL-3.0-only
    section: admin
    priority: optional
    dependencies: [systemd, pam, dbus, polkit, pacman, pacman-contrib]
