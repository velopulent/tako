# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: tako

before:
  hooks:
    - bun nx build dashboard

builds:
  - &distro_build
    id: debian
    dir: apps/backend
    main: ./cmd/tako
    binary: tako
    goos: [linux]
    goarch: [amd64]
    env: [CGO_ENABLED=1]
    flags: [-trimpath, -buildvcs=false]
    tags: [debian]
    ldflags: ["-s -w -X github.com/velopulent/tako/internal/version.Value={{ .Version }}"]
  - <<: *distro_build
    id: ubuntu
    tags: [ubuntu]
  - <<: *distro_build
    id: fedora
    tags: [fedora]
  - <<: *distro_build
    id: rhel
    tags: [rhel]
  - <<: *distro_build
    id: rocky
    tags: [rocky]
  - <<: *distro_build
    id: almalinux
    tags: [almalinux]
  - <<: *distro_build
    id: archlinux
    tags: [archlinux]
  - <<: *distro_build
    id: opensuse
    tags: [opensuse]

archives:
  - formats: [none]

signs: []
sboms: []

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - &debian_package
    id: debian-package
    ids: [debian]
    package_name: tako
    formats: [deb]
    file_name_template: "tako_{{ .Version }}_debian_{{ .Arch }}"
    bindir: /usr/bin
    vendor: Velopulent
    homepage: https://tako.velopulent.com
    maintainer: Tako maintainers
    description: Linux administration dashboard
    license: AGPL-3.0-only
    section: admin
    priority: optional
    dependencies: [systemd, libnss-systemd, libpam0g, dbus, polkitd, init-system-helpers, apt]
    scripts:
      postinstall: apps/backend/packaging/scripts/deb/postinst.sh
      preremove: apps/backend/packaging/scripts/deb/prerm.sh
      postremove: apps/backend/packaging/scripts/deb/postrm.sh
    contents:
      - { src: apps/backend/packaging/systemd/tako.service, dst: /usr/lib/systemd/system/tako.service }
      - { src: apps/backend/packaging/systemd/tako.socket, dst: /usr/lib/systemd/system/tako.socket }
      - { src: apps/backend/packaging/systemd/tako-sessiond.service, dst: /usr/lib/systemd/system/tako-sessiond.service }
      - { src: apps/backend/packaging/systemd/tako-sessiond.socket, dst: /usr/lib/systemd/system/tako-sessiond.socket }
      - { src: apps/backend/packaging/sysusers.d/tako.conf, dst: /usr/lib/sysusers.d/tako.conf }
      - { src: apps/backend/packaging/tmpfiles.d/tako.conf, dst: /usr/lib/tmpfiles.d/tako.conf }
      - { src: apps/backend/packaging/polkit/org.velopulent.tako.policy, dst: /usr/share/polkit-1/actions/org.velopulent.tako.policy }
      - { src: apps/backend/config.example.toml, dst: /usr/share/doc/tako/config.example.toml }
      - { src: apps/backend/packaging/pam/tako.debian, dst: /etc/pam.d/tako, type: "config|noreplace" }
      - { src: apps/backend/packaging/branding/debian.png, dst: /usr/share/tako/branding/debian.png }

  - <<: *debian_package
    id: ubuntu-package
    ids: [ubuntu]
    file_name_template: "tako_{{ .Version }}_ubuntu_{{ .Arch }}"
    contents:
      - { src: apps/backend/packaging/systemd/tako.service, dst: /usr/lib/systemd/system/tako.service }
      - { src: apps/backend/packaging/systemd/tako.socket, dst: /usr/lib/systemd/system/tako.socket }
      - { src: apps/backend/packaging/systemd/tako-sessiond.service, dst: /usr/lib/systemd/system/tako-sessiond.service }
      - { src: apps/backend/packaging/systemd/tako-sessiond.socket, dst: /usr/lib/systemd/system/tako-sessiond.socket }
      - { src: apps/backend/packaging/sysusers.d/tako.conf, dst: /usr/lib/sysusers.d/tako.conf }
      - { src: apps/backend/packaging/tmpfiles.d/tako.conf, dst: /usr/lib/tmpfiles.d/tako.conf }
      - { src: apps/backend/packaging/polkit/org.velopulent.tako.policy, dst: /usr/share/polkit-1/actions/org.velopulent.tako.policy }
      - { src: apps/backend/config.example.toml, dst: /usr/share/doc/tako/config.example.toml }
      - { src: apps/backend/packaging/pam/tako.debian, dst: /etc/pam.d/tako, type: "config|noreplace" }
      - { src: apps/backend/packaging/branding/ubuntu.png, dst: /usr/share/tako/branding/ubuntu.png }

  - &fedora_package
    id: fedora-package
    ids: [fedora]
    package_name: tako
    formats: [rpm]
    file_name_template: "tako_{{ .Version }}_fedora_{{ .Arch }}"
    bindir: /usr/bin
    vendor: Velopulent
    homepage: https://tako.velopulent.com
    maintainer: Tako maintainers
    description: Linux administration dashboard
    license: AGPL-3.0-only
    section: admin
    priority: optional
    dependencies: [systemd, pam, dbus, polkit, dnf]
    scripts: &rpm_scripts
      postinstall: apps/backend/packaging/scripts/rpm/post.sh
      preremove: apps/backend/packaging/scripts/rpm/preun.sh
      postremove: apps/backend/packaging/scripts/rpm/postun.sh
    contents:
      - { src: apps/backend/packaging/systemd/tako.service, dst: /usr/lib/systemd/system/tako.service }
      - { src: apps/backend/packaging/systemd/tako.socket, dst: /usr/lib/systemd/system/tako.socket }
      - { src: apps/backend/packaging/systemd/tako-sessiond.service, dst: /usr/lib/systemd/system/tako-sessiond.service }
      - { src: apps/backend/packaging/systemd/tako-sessiond.socket, dst: /usr/lib/systemd/system/tako-sessiond.socket }
      - { src: apps/backend/packaging/sysusers.d/tako.conf, dst: /usr/lib/sysusers.d/tako.conf }
      - { src: apps/backend/packaging/tmpfiles.d/tako.conf, dst: /usr/lib/tmpfiles.d/tako.conf }
      - { src: apps/backend/packaging/polkit/org.velopulent.tako.policy, dst: /usr/share/polkit-1/actions/org.velopulent.tako.policy }
      - { src: apps/backend/config.example.toml, dst: /usr/share/doc/tako/config.example.toml }
      - { src: apps/backend/packaging/pam/tako.redhat, dst: /etc/pam.d/tako, type: "config|noreplace" }
      - { src: apps/backend/packaging/branding/fedora.png, dst: /usr/share/tako/branding/fedora.png }

  - <<: *fedora_package
    id: rhel-package
    ids: [rhel]
    file_name_template: "tako_{{ .Version }}_rhel_{{ .Arch }}"
    contents:
      - { src: apps/backend/packaging/systemd/tako.service, dst: /usr/lib/systemd/system/tako.service }
      - { src: apps/backend/packaging/systemd/tako.socket, dst: /usr/lib/systemd/system/tako.socket }
      - { src: apps/backend/packaging/systemd/tako-sessiond.service, dst: /usr/lib/systemd/system/tako-sessiond.service }
      - { src: apps/backend/packaging/systemd/tako-sessiond.socket, dst: /usr/lib/systemd/system/tako-sessiond.socket }
      - { src: apps/backend/packaging/sysusers.d/tako.conf, dst: /usr/lib/sysusers.d/tako.conf }
      - { src: apps/backend/packaging/tmpfiles.d/tako.conf, dst: /usr/lib/tmpfiles.d/tako.conf }
      - { src: apps/backend/packaging/polkit/org.velopulent.tako.policy, dst: /usr/share/polkit-1/actions/org.velopulent.tako.policy }
      - { src: apps/backend/config.example.toml, dst: /usr/share/doc/tako/config.example.toml }
      - { src: apps/backend/packaging/pam/tako.redhat, dst: /etc/pam.d/tako, type: "config|noreplace" }
      - { src: apps/backend/packaging/branding/rhel.png, dst: /usr/share/tako/branding/rhel.png }

  - <<: *fedora_package
    id: rocky-package
    ids: [rocky]
    file_name_template: "tako_{{ .Version }}_rocky_{{ .Arch }}"
    contents:
      - { src: apps/backend/packaging/systemd/tako.service, dst: /usr/lib/systemd/system/tako.service }
      - { src: apps/backend/packaging/systemd/tako.socket, dst: /usr/lib/systemd/system/tako.socket }
      - { src: apps/backend/packaging/systemd/tako-sessiond.service, dst: /usr/lib/systemd/system/tako-sessiond.service }
      - { src: apps/backend/packaging/systemd/tako-sessiond.socket, dst: /usr/lib/systemd/system/tako-sessiond.socket }
      - { src: apps/backend/packaging/sysusers.d/tako.conf, dst: /usr/lib/sysusers.d/tako.conf }
      - { src: apps/backend/packaging/tmpfiles.d/tako.conf, dst: /usr/lib/tmpfiles.d/tako.conf }
      - { src: apps/backend/packaging/polkit/org.velopulent.tako.policy, dst: /usr/share/polkit-1/actions/org.velopulent.tako.policy }
      - { src: apps/backend/config.example.toml, dst: /usr/share/doc/tako/config.example.toml }
      - { src: apps/backend/packaging/pam/tako.redhat, dst: /etc/pam.d/tako, type: "config|noreplace" }
      - { src: apps/backend/packaging/branding/rocky.png, dst: /usr/share/tako/branding/rocky.png }

  - <<: *fedora_package
    id: almalinux-package
    ids: [almalinux]
    file_name_template: "tako_{{ .Version }}_almalinux_{{ .Arch }}"
    contents:
      - { src: apps/backend/packaging/systemd/tako.service, dst: /usr/lib/systemd/system/tako.service }
      - { src: apps/backend/packaging/systemd/tako.socket, dst: /usr/lib/systemd/system/tako.socket }
      - { src: apps/backend/packaging/systemd/tako-sessiond.service, dst: /usr/lib/systemd/system/tako-sessiond.service }
      - { src: apps/backend/packaging/systemd/tako-sessiond.socket, dst: /usr/lib/systemd/system/tako-sessiond.socket }
      - { src: apps/backend/packaging/sysusers.d/tako.conf, dst: /usr/lib/sysusers.d/tako.conf }
      - { src: apps/backend/packaging/tmpfiles.d/tako.conf, dst: /usr/lib/tmpfiles.d/tako.conf }
      - { src: apps/backend/packaging/polkit/org.velopulent.tako.policy, dst: /usr/share/polkit-1/actions/org.velopulent.tako.policy }
      - { src: apps/backend/config.example.toml, dst: /usr/share/doc/tako/config.example.toml }
