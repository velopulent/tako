openapi: 3.1.0
info:
  title: Tako Internal API
  version: 0.1.0
  description: Internal dashboard contract. Third-party compatibility is not guaranteed during v1.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
        '202':
          description: PAM requires another bounded conversation round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '204':
          description: Pending PAM conversation canceled
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session
  /capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200':
          description: Runtime module capabilities
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Host and current metric snapshot
  /metrics:
    get:
      operationId: getMetricHistory
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [15m, 1h, 6h, 24h], default: 1h }
      responses:
        '200':
          description: Bounded in-memory metric history
  /metrics/stream:
    get:
      operationId: streamMetrics
      parameters:
        - in: query
          name: interval
          schema: { type: string, enum: [1s, 5s, 15s, 30s, 1m, 5m], default: 1m }
      responses:
        '200':
          description: text/event-stream of metric events
  /preferences/monitoring:
    get:
      operationId: getMonitoringPreference
      responses:
        '200':
          description: Server-side default monitoring interval and optimistic-lock revision
    put:
      operationId: updateMonitoringPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultInterval, expectedRevision]
              properties:
                defaultInterval: { type: string, enum: [off, 1s, 5s, 15s, 30s, 1m, 5m] }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated preference and its new optimistic-lock revision
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /logs:
    get:
      operationId: listLogs
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: unit
          schema: { type: string }
      responses:
        '200': { description: Recent journal entries }
        '503': { $ref: '#/components/responses/Problem' }
  /logs/stream:
    get:
      operationId: streamLogs
      parameters:
        - in: query
          name: unit
          schema: { type: string }
      responses:
        '200': { description: text/event-stream of new journal entries }
  /users:
    get:
      operationId: listUsers
      responses:
        '200': { description: Local users }
  /updates:
    get:
      operationId: getUpdateStatus
      responses:
        '200': { description: PackageKit availability }
  /services:
    get:
      operationId: listServices
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [system, user], default: system } }
        - { in: query, name: type, schema: { type: string, enum: [service, target, socket, timer, path], default: service } }
      responses:
        '200': { description: systemd unit snapshot }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    get:
      operationId: getService
      responses:
        '200': { description: Unit status, runtime properties, and relationships }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/configuration:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    get:
      operationId: getServiceConfiguration
      responses:
        '200': { description: Bounded raw unit configuration derived from systemd metadata }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/actions:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    post:
      operationId: actOnService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, reload, enable, disable, mask, unmask] }
      responses:
        '200': { description: Refreshed unit state }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/actions/preview:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    post:
      operationId: previewServiceAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, reload, enable, disable, mask, unmask] }
      responses:
        '200': { description: Current service state and bounded affected relationships }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /timers/preview:
    post:
      operationId: previewTimer
      summary: Inspect a structured systemd timer pair without writing files
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimerOperation' }
      responses:
        '200':
          description: Current timer pair state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimerState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /timers:
    post:
      operationId: applyTimer
      summary: Create, update, enable, disable, or delete a structured timer pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimerOperation' }
      responses:
        '200':
          description: Updated timer pair state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimerState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/overrides/preview:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string, pattern: '^[A-Za-z0-9@._-]+\.service$' } }
    post:
      operationId: previewServiceOverride
      summary: Inspect Tako's managed service drop-in without writing it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOverrideOperation' }
      responses:
        '200':
          description: Current managed drop-in and recovery guidance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOverrideState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/overrides:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string, pattern: '^[A-Za-z0-9@._-]+\.service$' } }
    post:
      operationId: applyServiceOverride
      summary: Apply or remove Tako's allowlisted service drop-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOverrideOperation' }
      responses:
        '200':
          description: Updated managed drop-in and recovery guidance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOverrideState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /admin:
    get:
      operationId: getAdministrativeAccess
      responses:
        '200': { description: Current elevation state and expiry }
  /admin/elevate:
    post:
      operationId: gainAdministrativeAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdministrativeElevationRequest'
      responses:
        '200':
          description: Administrative access granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministrativeAccess'
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /admin/drop:
    post:
      operationId: dropAdministrativeAccess
      responses:
        '204': { description: Administrative access dropped }
  /operations:
    get:
      operationId: listOperationReceipts
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Sanitized operation receipts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OperationReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /jobs:
    get:
      operationId: listDiagnosticJobs
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Durable diagnostic jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DiagnosticJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /jobs/host-inventory:
    post:
      operationId: startHostInventoryJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: Host inventory job accepted
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/DiagnosticJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /jobs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      operationId: getDiagnosticJob
      responses:
        '200':
          description: Durable diagnostic job state
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/DiagnosticJob' }
        '404': { $ref: '#/components/responses/Problem' }
  /jobs/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    post:
      operationId: cancelDiagnosticJob
      summary: Cancel a pending or running diagnostic job
      responses:
        '200':
          description: Canceled diagnostic job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/DiagnosticJob' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /host/config:
    get:
      operationId: getHostConfiguration
      responses:
        '200':
          description: Current hostname, timezone, and NTP state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostConfiguration' }
        '503': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateHostConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostConfigurationUpdate' }
      responses:
        '200':
          description: Verified host configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostConfiguration' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /host/config/preview:
    post:
      operationId: previewHostConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostConfigurationUpdate' }
      responses:
        '200':
          description: Current and proposed host configuration with stale-state indication
          content:
            application/json:
              schema:
                type: object
                required: [current, proposed, changes, stale]
                properties:
                  current: { $ref: '#/components/schemas/HostConfiguration' }
                  proposed: { $ref: '#/components/schemas/HostConfiguration' }
                  changes:
                    type: array
                    items: { type: string, enum: [hostname, timezone, ntp] }
                  stale: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /host/power:
    get:
      operationId: getPowerStatus
      responses:
        '200':
          description: Capability and inhibitor status for reboot and shutdown
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PowerStatus' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: requestPowerAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PowerRequest' }
      responses:
        '202': { description: Power request accepted; host may disconnect }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /host/power/preview:
    post:
      operationId: previewPowerAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, expectedFingerprint]
              additionalProperties: false
              properties:
                action: { type: string, enum: [reboot, shutdown] }
                expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200': { description: Current capability, inhibitor, and confirmation requirements }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /storage:
    get:
      operationId: listStorage
      responses:
        '200': { description: Mounted filesystem inventory }
  /network:
    get:
      operationId: listNetworkInterfaces
      responses:
        '200': { description: Network interface inventory }
  /processes:
    get:
      operationId: listProcesses
      responses:
        '200': { description: Process inventory }
  /terminal:
    get:
      operationId: getTerminalStatus
      responses:
        '200': { description: User bridge readiness }
  /terminal/ws:
    get:
      operationId: openTerminal
      parameters:
        - in: query
          name: columns
          schema: { type: integer, minimum: 1, maximum: 65535 }
        - in: query
          name: rows
          schema: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '101': { description: Binary PTY WebSocket }
components:
  schemas:
    Capability:
      type: object
      required: [id, state, readable, mutable, rollback, readAuthority, mutationAuthority, contract]
      properties:
        id: { type: string }
        state: { type: string, enum: [ready, degraded, unavailable, conflicted] }
        backend: { type: string }
        version: { type: string }
        readable: { type: boolean }
        mutable: { type: boolean }
        rollback: { type: boolean }
        readAuthority: { type: string, enum: [none, session, user, administrative] }
        mutationAuthority: { type: string, enum: [none, user, administrative] }
        contract: { type: string }
        reason: { type: string }
        missingDependency: { type: string }
        setupGuidance: { type: string }
    AdministrativeElevationRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, maxLength: 4096 }
    AdministrativeAccess:
      type: object
      required: [administrative, until]
      properties:
        administrative: { type: boolean, const: true }
        until: { type: string, format: date-time }
    OperationReceipt:
      type: object
      required: [id, actor, target, startedAt, completedAt, result, administrative]
      properties:
        id: { type: string }
        actor: { type: string }
        target: { type: string }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        result: { type: string, enum: [succeeded, failed] }
        error: { type: string }
        administrative: { type: boolean }
    DiagnosticJob:
      type: object
      required: [id, kind, actor, state, progress, message, createdAt, cancelRequested, dangerous]
      properties:
        id: { type: string, maxLength: 64 }
        kind: { type: string, enum: [host-inventory] }
        actor: { type: string, maxLength: 256 }
        state: { type: string, enum: [pending, running, succeeded, failed, canceled, interrupted] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string, maxLength: 256 }
        result: { type: object, additionalProperties: true }
        error: { type: string, maxLength: 1024 }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        cancelRequested: { type: boolean }
        dangerous: { type: boolean }
    HostConfiguration:
      type: object
      required: [hostname, timezone, ntpEnabled, fingerprint]
      properties:
        hostname: { type: string, maxLength: 253 }
        timezone: { type: string, maxLength: 128 }
        ntpEnabled: { type: boolean }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
    ServiceImpact:
      type: object
      required: [scope, unit, action, currentState, currentSubState, affected, warnings]
      properties:
        scope: { type: string, enum: [system, user] }
        unit: { type: string, maxLength: 256 }
        action: { type: string, enum: [start, stop, restart, reload, enable, disable, mask, unmask] }
        currentState: { type: string }
        currentSubState: { type: string }
        affected:
          type: array
          maxItems: 128
          items:
            type: object
            required: [name, relationship]
            properties:
              name: { type: string, maxLength: 256 }
              relationship: { type: string }
        warnings:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 512 }
    UnitConfiguration:
      type: object
      required: [path, content, truncated]
      properties:
        path: { type: string, maxLength: 4096 }
        content: { type: string, maxLength: 1048576 }
        truncated: { type: boolean }
    HostConfigurationUpdate:
      type: object
      required: [hostname, timezone, ntpEnabled, expectedFingerprint]
      additionalProperties: false
      properties:
        hostname: { type: string, minLength: 1, maxLength: 253 }
        timezone: { type: string, minLength: 1, maxLength: 128 }
        ntpEnabled: { type: boolean }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
    PowerStatus:
      type: object
      required: [available, reboot, shutdown, inhibitors, fingerprint]
      properties:
        available: { type: boolean }
        reboot: { $ref: '#/components/schemas/PowerActionStatus' }
        shutdown: { $ref: '#/components/schemas/PowerActionStatus' }
        inhibitors:
          type: array
          items: { $ref: '#/components/schemas/PowerInhibitor' }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        reason: { type: string }
    PowerActionStatus:
      type: object
      required: [state, available]
      properties:
        state: { type: string, enum: [available, challenged, denied, inhibited, unavailable] }
        available: { type: boolean }
        reason: { type: string }
    PowerInhibitor:
      type: object
      required: [what, who, why, mode, uid, pid]
      properties:
        what: { type: string }
        who: { type: string }
        why: { type: string }
        mode: { type: string }
        uid: { type: integer }
        pid: { type: integer }
    PowerRequest:
      type: object
      required: [action, confirmation, expectedFingerprint]
      additionalProperties: false
      properties:
        action: { type: string, enum: [reboot, shutdown] }
        confirmation: { type: string, enum: [REBOOT, SHUTDOWN] }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
    TimerOperation:
      type: object
      additionalProperties: false
      required: [action, scope, name]
      properties:
        action: { type: string, enum: [preview, create, update, delete, enable, disable] }
        scope: { type: string, enum: [system, user] }
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9@._-]+$' }
        description: { type: string, maxLength: 256 }
        onCalendar: { type: string, maxLength: 256 }
        onBootSec: { type: string, maxLength: 256 }
        onUnitActiveSec: { type: string, maxLength: 256 }
        command: { type: string, minLength: 1, maxLength: 512 }
        persistent: { type: boolean }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-fA-F0-9]{64}$' }
    TimerState:
      type: object
      required: [scope, name, timerUnit, serviceUnit, exists, enabled]
      properties:
        scope: { type: string, enum: [system, user] }
        name: { type: string, maxLength: 64 }
        timerUnit: { type: string, maxLength: 80 }
        serviceUnit: { type: string, maxLength: 80 }
        exists: { type: boolean }
        enabled: { type: boolean }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        definition:
          $ref: '#/components/schemas/TimerDefinition'
    TimerDefinition:
      type: object
      properties:
        description: { type: string, maxLength: 256 }
        onCalendar: { type: string, maxLength: 256 }
        onBootSec: { type: string, maxLength: 256 }
        onUnitActiveSec: { type: string, maxLength: 256 }
        command: { type: string, maxLength: 512 }
        persistent: { type: boolean }
    ServiceOverrideOperation:
      type: object
      additionalProperties: false
      required: [action, scope, unit]
      properties:
        action: { type: string, enum: [preview, apply, delete] }
        scope: { type: string, enum: [system, user] }
        unit: { type: string, maxLength: 256, pattern: '^[A-Za-z0-9@._-]+\.service$' }
        environment:
          type: object
          maxProperties: 64
          additionalProperties: { type: string, maxLength: 4096 }
        restart: { type: string, enum: [no, on-success, on-failure, on-abnormal, on-watchdog, on-abort, always] }
        restartSec: { type: string, maxLength: 64 }
        timeoutStartSec: { type: string, maxLength: 64 }
        timeoutStopSec: { type: string, maxLength: 64 }
        nice: { type: integer, minimum: -20, maximum: 19 }
        cpuQuota: { type: string, pattern: '^[0-9]+(\.[0-9]+)?%$' }
        memoryMax: { type: string, maxLength: 32 }
        tasksMax: { type: integer, minimum: 1, maximum: 1000000 }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-fA-F0-9]{64}$' }
    ServiceOverrideState:
      type: object
      required: [scope, unit, path, exists, guidance]
      properties:
        scope: { type: string, enum: [system, user] }
        unit: { type: string, maxLength: 256 }
        path: { type: string, maxLength: 4096 }
        exists: { type: boolean }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        definition: { $ref: '#/components/schemas/ServiceOverrideDefinition' }
        guidance:
          type: array
          maxItems: 4
          items: { type: string, maxLength: 512 }
    ServiceOverrideDefinition:
      type: object
      properties:
        environment: { type: object, additionalProperties: { type: string, maxLength: 4096 } }
        restart: { type: string }
        restartSec: { type: string }
        timeoutStartSec: { type: string }
        timeoutStopSec: { type: string }
        nice: { type: integer }
        cpuQuota: { type: string }
        memoryMax: { type: string }
        tasksMax: { type: integer }
    LoginRequest:
      oneOf:
        - type: object
          required: [username]
          additionalProperties: false
          properties:
            username: { type: string, minLength: 1, maxLength: 256 }
            password: { type: string, maxLength: 4096 }
        - type: object
          required: [conversationId, responses]
          additionalProperties: false
          properties:
            conversationId: { type: string, minLength: 1, maxLength: 64 }
            responses:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                required: [id, value]
                additionalProperties: false
                properties:
                  id: { type: string, minLength: 1, maxLength: 64 }
                  value: { type: string, maxLength: 4096 }
        - type: object
          required: [conversationId, cancel]
          additionalProperties: false
          properties:
            conversationId: { type: string, minLength: 1, maxLength: 64 }
            cancel: { type: boolean, const: true }
    LoginChallenge:
      type: object
      required: [conversationId, prompts]
      properties:
        conversationId: { type: string }
        prompts:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [id, style, message]
            properties:
              id: { type: string }
              style: { type: string, enum: [hidden, text, info, error] }
              message: { type: string, maxLength: 1024 }
    Problem:
      type: object
      required: [title, status, code]
      properties:
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
    MetricSample:
      type: object
      required: [timestamp, cpuPercent, memoryUsed, memoryTotal, networkRx, networkTx, diskRead, diskWrite]
      properties:
        timestamp: { type: string, format: date-time }
        cpuPercent: { type: number }
        cpuCorePercent: { type: array, items: { type: number } }
        memoryUsed: { type: integer }
        memoryTotal: { type: integer }
        swapUsed: { type: integer }
        swapTotal: { type: integer }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        networkRx: { type: integer }
        networkTx: { type: integer }
        diskRead: { type: integer }
        diskWrite: { type: integer }
  responses:
    Problem:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
