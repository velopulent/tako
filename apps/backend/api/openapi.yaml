        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /files:
    get:
      operationId: listFiles
      parameters:
        - in: query
          name: path
          schema: { type: string, maxLength: 4096, default: . }
        - in: query
          name: hidden
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Authority-filtered directory listing
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileResult' } }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    post:
      operationId: applyFileOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileOperation' }
      responses:
        '200':
          description: Completed bounded file operation
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileResult' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /files/content:
    get:
      operationId: readFileContent
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, maxLength: 4096 }
        - in: header
          name: Range
          schema: { type: string, pattern: '^bytes=([0-9]+-[0-9]*|-[0-9]+)$' }
        - in: header
          name: If-Range
          schema: { type: string, maxLength: 128 }
        - in: header
          name: If-None-Match
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 'Bounded file content; supports Accept-Ranges, ETag, and safe Content-Disposition headers'
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            ETag: { schema: { type: string, maxLength: 128 } }
            Content-Disposition: { schema: { type: string, maxLength: 256 } }
        '206':
          description: Partial file content with Content-Range
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
            Content-Range: { schema: { type: string, maxLength: 128 } }
            ETag: { schema: { type: string, maxLength: 128 } }
        '304': { description: File content is unchanged for If-None-Match }
        '400': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /files/search:
    get:
      operationId: searchFiles
      parameters:
        - in: query
          name: path
          schema: { type: string, maxLength: 4096, default: . }
        - in: query
          name: query
          required: true
          schema: { type: string, maxLength: 512 }
        - in: query
          name: maxEntries
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1000 }
      responses:
        '200': { description: Bounded filename search, content: { application/json: { schema: { $ref: '#/components/schemas/FileResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /files/text-window:
    get:
      operationId: readTextWindow
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200': { description: Windowed JSON text lines }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /files/upload:
    post:
      operationId: uploadFileChunk
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: total
          schema: { type: integer, minimum: 0, maximum: 1099511627776 }
        - in: header
          name: X-Content-SHA256
          schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary, maxLength: 4194304 } }
      responses:
        '200': { description: Chunk receipt with the next Upload-Offset }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
  /processes:
    get:
      operationId: listProcesses
      description: Read-only system-wide process inventory for any authenticated session. Process control is authorized separately; individual rows may report restricted optional fields.
      responses:
        '200':
          description: Process inventory with PID-start identity and per-process access status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 4096
                    items: { $ref: '#/components/schemas/ProcessInfo' }
  /processes/{pid}:
    get:
      operationId: getProcessDetails
      description: Read-only system-wide process inspection for any authenticated session. PID plus Linux start ticks identify the process; optional procfs fields may be restricted.
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: started
          schema: { type: integer, minimum: 1, description: Linux process start ticks used to reject PID reuse }
      responses:
        '200':
          description: Process relationships, resource history, cgroup, files, and sockets
          content:
            application/json: { schema: { $ref: '#/components/schemas/ProcessDetails' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /processes/{pid}/signal/preview:
    post:
      operationId: previewProcessSignal
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ProcessSignalRequest' } }
      responses:
        '200': { description: Exact process/tree impact preview, content: { application/json: { schema: { $ref: '#/components/schemas/SignalPreview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /processes/{pid}/signal:
    post:
      operationId: signalProcess
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ProcessSignalApplyRequest' } }
      responses:
        '200': { description: Signal result, content: { application/json: { schema: { $ref: '#/components/schemas/SignalResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /terminal:
    get:
      operationId: getTerminalStatus
      responses:
        '200': { description: User bridge readiness }
  /terminal/ws:
    get:
      operationId: openTerminal
      parameters:
        - in: query
          name: columns
          schema: { type: integer, minimum: 1, maximum: 65535 }
        - in: query
          name: rows
          schema: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '101': { description: Binary PTY WebSocket }
components:
  schemas:
    Branding:
      type: object
      additionalProperties: false
      required: [distribution, hostname]
      properties:
        distribution: { type: string, maxLength: 32 }
        hostname: { type: string, maxLength: 253 }
        backgroundUrl: { type: string, maxLength: 512, format: uri-reference }
    Capability:
      type: object
      required: [id, state, readable, mutable, rollback, readAuthority, mutationAuthority, contract]
      properties:
        id: { type: string }
        state: { type: string, enum: [ready, degraded, unavailable, conflicted] }
        backend: { type: string }
        version: { type: string }
        readable: { type: boolean }
        mutable: { type: boolean }
        rollback: { type: boolean }
        readAuthority: { type: string, enum: [none, session, user, administrative] }
        mutationAuthority: { type: string, enum: [none, user, administrative] }
        contract: { type: string }
        reason: { type: string }
        missingDependency: { type: string }
        setupGuidance: { type: string }
        scopes:
          type: object
          description: Per-execution-lane readiness and authority.
          additionalProperties:
            $ref: '#/components/schemas/CapabilityScope'
    CapabilityScope:
      type: object
      required: [state, readable, mutable, authority]
      properties:
        state: { type: string, enum: [ready, degraded, unavailable, conflicted] }
        readable: { type: boolean }
        mutable: { type: boolean }
        authority: { type: string, enum: [none, user-bridge, root-sessiond, gateway] }
        reason: { type: string }
    UpdateStatus:
      type: object
      required: [available, backend, contract, packages, fingerprint, externalLock, message, recovery]
      properties:
        available: { type: boolean }
        backend: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 128 }
