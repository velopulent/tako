openapi: 3.1.0
info:
  title: Tako Internal API
  version: 0.1.0
  description: Internal dashboard contract. Third-party compatibility is not guaranteed during v1.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
        '202':
          description: PAM requires another bounded conversation round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '204':
          description: Pending PAM conversation canceled
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session
  /capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200':
          description: Runtime module capabilities
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: { $ref: '#/components/schemas/Capability' }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Host and current metric snapshot
  /metrics:
    get:
      operationId: getMetricHistory
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [15m, 1h, 6h, 24h], default: 1h }
      responses:
        '200':
          description: Bounded in-memory metric history
  /metrics/stream:
    get:
      operationId: streamMetrics
      parameters:
        - in: query
          name: interval
          schema: { type: string, enum: [1s, 5s, 15s, 30s, 1m, 5m], default: 1m }
      responses:
        '200':
          description: text/event-stream of metric events
  /preferences/monitoring:
    get:
      operationId: getMonitoringPreference
      responses:
        '200':
          description: Server-side default monitoring interval and optimistic-lock revision
    put:
      operationId: updateMonitoringPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultInterval, expectedRevision]
              properties:
                defaultInterval: { type: string, enum: [off, 1s, 5s, 15s, 30s, 1m, 5m] }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated preference and its new optimistic-lock revision
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /logs:
    get:
      operationId: listLogs
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 8192 }
        - in: query
          name: boot
          schema: { type: string, pattern: '^(current|[a-fA-F0-9]{32})$' }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: priority
          schema: { type: string, pattern: '^[0-7](\.\.[0-7])?$' }
        - in: query
          name: unit
          schema: { type: string }
        - in: query
          name: executable
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: text
          schema: { type: string, maxLength: 512 }
        - in: query
          name: details
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Bounded structured journal page with an opaque next cursor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JournalPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /logs/stream:
    get:
      operationId: streamLogs
      parameters:
        - in: query
          name: unit
          schema: { type: string }
        - in: query
          name: boot
          schema: { type: string, pattern: '^(current|[a-fA-F0-9]{32})$' }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: priority
          schema: { type: string, pattern: '^[0-7](\.\.[0-7])?$' }
        - in: query
          name: executable
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: text
          schema: { type: string, maxLength: 512 }
        - in: query
          name: details
          schema: { type: boolean, default: false }
      responses:
        '200': { description: text/event-stream of new journal entries }
        '400': { $ref: '#/components/responses/Problem' }
  /logs/export:
    get:
      operationId: exportLogs
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [csv, json], default: csv }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 8192 }
        - in: query
          name: boot
          schema: { type: string, pattern: '^(current|[a-fA-F0-9]{32})$' }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: priority
          schema: { type: string, pattern: '^[0-7](\.\.[0-7])?$' }
        - in: query
          name: unit
          schema: { type: string }
        - in: query
          name: executable
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: text
          schema: { type: string, maxLength: 512 }
        - in: query
          name: details
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Bounded filtered journal export
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/json: { schema: { $ref: '#/components/schemas/JournalPage' } }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /log-views:
    get:
      operationId: listSavedLogViews
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: Saved journal views owned by the authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/SavedLogView' }
    post:
      operationId: createSavedLogView
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SavedLogViewRequest' } }
      responses:
        '201': { description: Saved journal view created, content: { application/json: { schema: { $ref: '#/components/schemas/SavedLogView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /log-views/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, maxLength: 128 }
    put:
      operationId: updateSavedLogView
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SavedLogViewUpdateRequest' } }
      responses:
        '200': { description: Saved journal view updated, content: { application/json: { schema: { $ref: '#/components/schemas/SavedLogView' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSavedLogView
      parameters:
        - in: query
          name: expectedRevision
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Saved journal view deleted }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: NSS user inventory with local mutability and remote read-only status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100000
                    items: { $ref: '#/components/schemas/NSSUser' }
        '503': { $ref: '#/components/responses/Problem' }
  /users/{username}/login-history:
    parameters:
      - in: path
        name: username
        required: true
        schema: { type: string, minLength: 1, maxLength: 256 }
    get:
      operationId: listAccountLoginHistory
      description: Bounded login and session events read directly from journald. Deleted or remote NSS identities remain queryable for administrators and are never copied into SQLite.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 8192 }
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: until
          schema: { type: string, format: date-time }
        - in: query
          name: outcome
          schema: { type: string, enum: [success, failure] }
      responses:
        '200':
          description: Bounded account login and session history with identity source metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginHistoryPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /users/account/preview:
    post:
      operationId: previewLocalAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalAccountOperation' }
      responses:
        '200':
          description: Stale-aware local account impact preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAccountPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /users/account:
    post:
      operationId: applyLocalAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalAccountOperation' }
      responses:
        '200':
          description: Verified local account state after the operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAccountState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /users/password:
    post:
      operationId: changeOrResetPassword
      description: Change the signed-in user's password or, with Administrative access, reset a local user's password. Secret fields are processed only in memory and are never returned or recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeOperation' }
      responses:
        '204': { description: Password changed or reset successfully }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /users/ssh-keys:
    get:
      operationId: listAuthorizedSSHKeys
      parameters:
        - in: query
          name: username
          schema: { type: string, maxLength: 32, pattern: '^[a-z_][a-z0-9_$-]*$' }
      responses:
        '200':
          description: Authorized keys under the target account's protected home path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHKeyState' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: applyAuthorizedSSHKeyOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SSHKeyOperation' }
      responses:
        '200':
          description: Verified authorized key state after an atomic operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHKeyState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /users/ssh-keys/preview:
    post:
      operationId: previewAuthorizedSSHKeyOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SSHKeyOperation' }
      responses:
        '200':
          description: Stale-aware authorized key impact preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SSHKeyPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups:
    get:
      operationId: listGroups
      responses:
        '200':
          description: NSS group inventory with local mutability and remote read-only status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100000
                    items: { $ref: '#/components/schemas/NSSGroup' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/membership/preview:
    post:
      operationId: previewGroupMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMembershipOperation' }
      responses:
        '200':
          description: Stale-aware group membership preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMembershipPreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/membership:
    post:
      operationId: applyGroupMembership
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMembershipOperation' }
      responses:
        '200':
          description: Verified group membership state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMembershipState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/admin-role/preview:
    post:
      operationId: previewAdministrativeRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrativeRoleOperation' }
      responses:
        '200':
          description: Stale-aware administrator-role preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeRolePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /groups/admin-role:
    post:
      operationId: applyAdministrativeRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministrativeRoleOperation' }
      responses:
        '200':
          description: Verified administrator-role state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdministrativeRoleState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /updates:
    get:
      operationId: getUpdateStatus
      responses:
        '200':
          description: Bounded installed-software update inventory with backend contract and lock state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateStatus' }
    post:
      operationId: startUpdateJob
      summary: Start a serialized selected or all-software update job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOperation' }
      responses:
        '202':
          description: Durable update job accepted
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/DiagnosticJob' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /updates/preview:
    post:
      operationId: previewUpdates
      summary: Preview a selected or all-software update operation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOperation' }
      responses:
        '200':
          description: Current inventory, changes, warnings, and stale state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdatePreview' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /services:
    get:
      operationId: listServices
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [system, user], default: system } }
        - { in: query, name: type, schema: { type: string, enum: [service, target, socket, timer, path], default: service } }
      responses:
        '200': { description: systemd unit snapshot }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    get:
      operationId: getService
      responses:
        '200': { description: Unit status, runtime properties, and relationships }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/configuration:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    get:
      operationId: getServiceConfiguration
      responses:
        '200': { description: Bounded raw unit configuration derived from systemd metadata }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/actions:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    post:
      operationId: actOnService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, reload, enable, disable, mask, unmask] }
      responses:
        '200': { description: Refreshed unit state }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/actions/preview:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    post:
      operationId: previewServiceAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, reload, enable, disable, mask, unmask] }
      responses:
        '200': { description: Current service state and bounded affected relationships }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /timers/preview:
    post:
      operationId: previewTimer
      summary: Inspect a structured systemd timer pair without writing files
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimerOperation' }
      responses:
        '200':
          description: Current timer pair state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimerState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /timers:
    post:
      operationId: applyTimer
      summary: Create, update, enable, disable, or delete a structured timer pair
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimerOperation' }
      responses:
        '200':
          description: Updated timer pair state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimerState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/overrides/preview:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string, pattern: '^[A-Za-z0-9@._-]+\.service$' } }
    post:
      operationId: previewServiceOverride
      summary: Inspect Tako's managed service drop-in without writing it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOverrideOperation' }
      responses:
        '200':
          description: Current managed drop-in and recovery guidance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOverrideState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/overrides:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string, pattern: '^[A-Za-z0-9@._-]+\.service$' } }
    post:
      operationId: applyServiceOverride
      summary: Apply or remove Tako's allowlisted service drop-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOverrideOperation' }
      responses:
        '200':
          description: Updated managed drop-in and recovery guidance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOverrideState' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /admin:
    get:
      operationId: getAdministrativeAccess
      responses:
        '200': { description: Current elevation state and expiry }
  /admin/elevate:
    post:
      operationId: gainAdministrativeAccess
      requestBody:
        required: true
