          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Bounded correlated incident timeline; journal data remains in the journal browser
          content: { application/json: { schema: { $ref: '#/components/schemas/IncidentTimeline' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /notifications:
    get:
      operationId: listNotifications
      parameters:
        - in: query
          name: state
          schema: { type: string, enum: [open, acknowledged, muted, resolved] }
      responses:
        '200': { description: Built-in bounded notification list }
  /notifications/{id}/{state}:
    post:
      operationId: transitionNotification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, maxLength: 512 }
        - in: path
          name: state
          required: true
          schema: { type: string, enum: [acknowledged, muted, resolved] }
      responses:
        '200': { description: Notification state transition }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /certificates:
    get:
      operationId: getCertificateStatus
      responses:
