        - in: path
          name: state
          required: true
          schema: { type: string, enum: [acknowledged, muted, resolved] }
      responses:
        '200': { description: Notification state transition }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /files:
    get:
      operationId: listFiles
      parameters:
        - in: query
          name: path
          schema: { type: string, maxLength: 4096, default: . }
        - in: query
          name: hidden
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Authority-filtered directory listing
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileResult' } }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
    post:
      operationId: applyFileOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileOperation' }
      responses:
        '200':
          description: Completed bounded file operation
          content:
            application/json: { schema: { $ref: '#/components/schemas/FileResult' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /files/content:
    get:
      operationId: readFileContent
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, maxLength: 4096 }
        - in: header
          name: Range
          schema: { type: string, pattern: '^bytes=[0-9]+-[0-9]+$' }
      responses:
        '200': { description: 'Bounded file content; supports Accept-Ranges: bytes' }
        '206': { description: Partial file content with Content-Range }
        '400': { $ref: '#/components/responses/Problem' }
        '416': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /files/text-window:
    get:
      operationId: readTextWindow
      parameters:
        - in: query
          name: path
          required: true
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200': { description: Windowed JSON text lines }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /processes:
    get:
      operationId: listProcesses
      responses:
        '200':
          description: Process inventory with PID-start identity and per-process access status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 4096
                    items: { $ref: '#/components/schemas/ProcessInfo' }
  /processes/{pid}:
    get:
      operationId: getProcessDetails
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: started
          schema: { type: integer, minimum: 1, description: Linux process start ticks used to reject PID reuse }
      responses:
        '200':
          description: Process relationships, resource history, cgroup, files, and sockets
          content:
            application/json: { schema: { $ref: '#/components/schemas/ProcessDetails' } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /processes/{pid}/signal/preview:
    post:
      operationId: previewProcessSignal
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ProcessSignalRequest' } }
      responses:
        '200': { description: Exact process/tree impact preview, content: { application/json: { schema: { $ref: '#/components/schemas/SignalPreview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /processes/{pid}/signal:
    post:
      operationId: signalProcess
      parameters:
        - in: path
          name: pid
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ProcessSignalApplyRequest' } }
      responses:
        '200': { description: Signal result, content: { application/json: { schema: { $ref: '#/components/schemas/SignalResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /terminal:
    get:
      operationId: getTerminalStatus
      responses:
        '200': { description: User bridge readiness }
  /terminal/ws:
    get:
      operationId: openTerminal
      parameters:
        - in: query
          name: columns
          schema: { type: integer, minimum: 1, maximum: 65535 }
        - in: query
          name: rows
          schema: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '101': { description: Binary PTY WebSocket }
components:
  schemas:
    Capability:
      type: object
      required: [id, state, readable, mutable, rollback, readAuthority, mutationAuthority, contract]
      properties:
        id: { type: string }
        state: { type: string, enum: [ready, degraded, unavailable, conflicted] }
        backend: { type: string }
        version: { type: string }
        readable: { type: boolean }
        mutable: { type: boolean }
        rollback: { type: boolean }
        readAuthority: { type: string, enum: [none, session, user, administrative] }
        mutationAuthority: { type: string, enum: [none, user, administrative] }
        contract: { type: string }
        reason: { type: string }
        missingDependency: { type: string }
        setupGuidance: { type: string }
    UpdateStatus:
      type: object
      required: [available, backend, contract, packages, fingerprint, externalLock, message, recovery]
      properties:
        available: { type: boolean }
        backend: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 128 }
        contract: { type: string, enum: [dbus-read-only, bounded-command-read-only, unavailable] }
        packages:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/UpdatePackage' }
        fingerprint: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        externalLock: { type: boolean }
        lockReason: { type: string, maxLength: 512 }
        message: { type: string, maxLength: 512 }
        reason: { type: string, maxLength: 512 }
        recovery: { $ref: '#/components/schemas/UpdateRecovery' }
    UpdateRecovery:
      type: object
      required: [authoritative, rebootRequired, restartServices, hints, source]
      properties:
        authoritative: { type: boolean }
        rebootRequired: { type: boolean }
        restartServices: { type: array, maxItems: 128, items: { type: string, maxLength: 256 } }
        hints: { type: array, maxItems: 16, items: { type: string, maxLength: 512 } }
        source: { type: string, maxLength: 128 }
    FileOperation:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [list, stat, read, read-window, write, create, rename, move, copy, trash, delete, search, archive, extract, metadata] }
        path: { type: string, maxLength: 4096 }
        destination: { type: string, maxLength: 4096 }
        kind: { type: string, enum: [file, directory] }
        content: { type: string, format: byte, maxLength: 5592406 }
        contentSha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        offset: { type: integer, minimum: 0, maximum: 4194304 }
        limit: { type: integer, minimum: 0, maximum: 4194304 }
        lineOffset: { type: integer, minimum: 0 }
        lineLimit: { type: integer, minimum: 1, maximum: 1000 }
        expectedFingerprint: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        showHidden: { type: boolean }
        recursive: { type: boolean }
        permanent: { type: boolean }
        confirmation: { type: string, maxLength: 128 }
        query: { type: string, maxLength: 512 }
        maxEntries: { type: integer, minimum: 0, maximum: 10000 }
        archivePath: { type: string, maxLength: 4096 }
        mode: { type: integer, minimum: 0, maximum: 511 }
        owner: { type: string, maxLength: 256 }
        group: { type: string, maxLength: 256 }
    NetworkOperation:
      type: object
      additionalProperties: false
      required: [backend, action]
      properties:
        backend: { type: string, enum: [NetworkManager, Netplan, systemd-networkd] }
        action: { type: string, enum: [preview, dhcp, static, dns, route-add, route-remove, checkpoint, commit, rollback] }
        interface: { type: string, maxLength: 256 }
        connection: { type: string, maxLength: 256 }
        address: { type: string, maxLength: 128 }
        gateway: { type: string, maxLength: 128 }
        dns: { type: array, maxItems: 8, items: { type: string } }
        route: { type: string, maxLength: 128 }
        metric: { type: integer, minimum: 0, maximum: 65535 }
        expectedFingerprint: { type: string, maxLength: 128 }
        confirmation: { type: string, maxLength: 128 }
        reconnectToken: { type: string, maxLength: 256 }
    NetworkState:
      type: object
      required: [snapshot, action, committed, rollback]
      properties:
        snapshot: { type: object }
        action: { type: string }
        checkpoint: { type: string }
        committed: { type: boolean }
        rollback: { type: boolean }
        warning: { type: string }
    FirewallOperation:
      type: object
      additionalProperties: false
      required: [backend, action]
      properties:
        backend: { type: string, enum: [auto, firewalld, UFW] }
        action: { type: string, enum: [preview, enable, disable, default-zone, add-service, remove-service, add-port, remove-port, add-source, remove-source, reload] }
        zone: { type: string, maxLength: 128 }
        service: { type: string, maxLength: 128 }
        port: { type: string, maxLength: 32 }
        source: { type: string, maxLength: 128 }
        defaultZone: { type: string, maxLength: 128 }
        expectedFingerprint: { type: string, maxLength: 128 }
        confirmation: { type: string, maxLength: 128 }
        persist: { type: boolean }
    FirewallState:
      type: object
      required: [snapshot, action, applied]
      properties:
        snapshot: { type: object }
        action: { type: string }
        applied: { type: boolean }
        warning: { type: string }
    SecurityOperation:
      type: object
      additionalProperties: false
      required: [action, framework]
      properties:
        action: { type: string, enum: [inspect, selinux-boolean, selinux-restorecon, apparmor-enforce, apparmor-complain, apparmor-load] }
        framework: { type: string, enum: [SELinux, AppArmor] }
        boolean: { type: string, maxLength: 128 }
        value: { type: boolean }
        path: { type: string, maxLength: 4096 }
        profile: { type: string, maxLength: 256 }
        expectedFingerprint: { type: string, maxLength: 128 }
        confirmation: { type: string, maxLength: 128 }
    IncidentEvent:
      type: object
      required: [id, timestamp, severity, kind, summary]
      properties:
        id: { type: string, maxLength: 512 }
        timestamp: { type: string, format: date-time }
        severity: { type: string, enum: [critical, error, warning] }
        kind: { type: string }
        source: { type: string }
        summary: { type: string, maxLength: 512 }
        cursor: { type: string, maxLength: 4096 }
    IncidentTimeline:
      type: object
      required: [items, since, until, partial]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/IncidentEvent' }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        partial: { type: boolean }
        warnings:
          type: array
          maxItems: 8
          items: { type: string, maxLength: 512 }
    FileEntry:
      type: object
      required: [name, path, kind, size, mode, modifiedAt, fingerprint, hidden, readable, writable]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [file, directory, symlink] }
        size: { type: integer, minimum: 0 }
        mode: { type: integer, minimum: 0 }
        modifiedAt: { type: string, format: date-time }
        fingerprint: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        hidden: { type: boolean }
        readable: { type: boolean }
        writable: { type: boolean }
        permissionDenied: { type: boolean }
        symlinkTarget: { type: string }
        mime: { type: string }
        reason: { type: string }
    FileDirectory:
      type: object
      required: [path, entries, showHidden, fingerprint]
      properties:
        path: { type: string }
        entries:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/FileEntry' }
        showHidden: { type: boolean }
        fingerprint: { type: string }
    FileSearchResult:
      type: object
      required: [root, query, entries, limited]
      properties:
        root: { type: string }
