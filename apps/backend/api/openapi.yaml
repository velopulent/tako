    post:
      operationId: applySecurityOperation
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SecurityOperation' } }
      responses:
        '200': { description: Verified security policy state after the operation }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
