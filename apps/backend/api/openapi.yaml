openapi: 3.1.0
info:
  title: Tako Internal API
  version: 0.1.0
  description: Internal dashboard contract. Third-party compatibility is not guaranteed during v1.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated session
        '202':
          description: PAM requires another bounded conversation round
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '204':
          description: Pending PAM conversation canceled
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /auth/session:
    get:
      operationId: getSession
      responses:
        '200':
          description: Current session
  /capabilities:
    get:
      operationId: listCapabilities
      responses:
        '200':
          description: Runtime module capabilities
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        '200':
          description: Host and current metric snapshot
  /metrics:
    get:
      operationId: getMetricHistory
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [15m, 1h, 6h, 24h], default: 1h }
      responses:
        '200':
          description: Bounded in-memory metric history
  /metrics/stream:
    get:
      operationId: streamMetrics
      parameters:
        - in: query
          name: interval
          schema: { type: string, enum: [1s, 5s, 15s, 30s, 1m, 5m], default: 1m }
      responses:
        '200':
          description: text/event-stream of metric events
  /preferences/monitoring:
    get:
      operationId: getMonitoringPreference
      responses:
        '200':
          description: Server-side default monitoring interval and optimistic-lock revision
    put:
      operationId: updateMonitoringPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultInterval, expectedRevision]
              properties:
                defaultInterval: { type: string, enum: [off, 1s, 5s, 15s, 30s, 1m, 5m] }
                expectedRevision: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated preference and its new optimistic-lock revision
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /logs:
    get:
      operationId: listLogs
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - in: query
          name: unit
          schema: { type: string }
      responses:
        '200': { description: Recent journal entries }
        '503': { $ref: '#/components/responses/Problem' }
  /logs/stream:
    get:
      operationId: streamLogs
      parameters:
        - in: query
          name: unit
          schema: { type: string }
      responses:
        '200': { description: text/event-stream of new journal entries }
  /users:
    get:
      operationId: listUsers
      responses:
        '200': { description: Local users }
  /updates:
    get:
      operationId: getUpdateStatus
      responses:
        '200': { description: PackageKit availability }
  /services:
    get:
      operationId: listServices
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [system, user], default: system } }
        - { in: query, name: type, schema: { type: string, enum: [service, target, socket, timer, path], default: service } }
      responses:
        '200': { description: systemd unit snapshot }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    get:
      operationId: getService
      responses:
        '200': { description: Unit status, runtime properties, and relationships }
        '503': { $ref: '#/components/responses/Problem' }
  /services/{scope}/{unit}/actions:
    parameters:
      - { in: path, name: scope, required: true, schema: { type: string, enum: [system, user] } }
      - { in: path, name: unit, required: true, schema: { type: string } }
    post:
      operationId: actOnService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, stop, restart, reload, enable, disable, mask, unmask] }
      responses:
        '200': { description: Refreshed unit state }
        '403': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /admin:
    get:
      operationId: getAdministrativeAccess
      responses:
        '200': { description: Current elevation state and expiry }
  /admin/elevate:
    post:
      operationId: gainAdministrativeAccess
      responses:
        '200': { description: Administrative access granted }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/drop:
    post:
      operationId: dropAdministrativeAccess
      responses:
        '204': { description: Administrative access dropped }
  /storage:
    get:
      operationId: listStorage
      responses:
        '200': { description: Mounted filesystem inventory }
  /network:
    get:
      operationId: listNetworkInterfaces
      responses:
        '200': { description: Network interface inventory }
  /processes:
    get:
      operationId: listProcesses
      responses:
        '200': { description: Process inventory }
  /terminal:
    get:
      operationId: getTerminalStatus
      responses:
        '200': { description: User bridge readiness }
  /terminal/ws:
    get:
      operationId: openTerminal
      parameters:
        - in: query
          name: columns
          schema: { type: integer, minimum: 1, maximum: 65535 }
        - in: query
          name: rows
          schema: { type: integer, minimum: 1, maximum: 65535 }
      responses:
        '101': { description: Binary PTY WebSocket }
components:
  schemas:
    LoginRequest:
      oneOf:
        - type: object
          required: [username]
          additionalProperties: false
          properties:
            username: { type: string, minLength: 1, maxLength: 256 }
            password: { type: string, maxLength: 4096 }
        - type: object
          required: [conversationId, responses]
          additionalProperties: false
          properties:
            conversationId: { type: string, minLength: 1, maxLength: 64 }
            responses:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                required: [id, value]
                additionalProperties: false
                properties:
                  id: { type: string, minLength: 1, maxLength: 64 }
                  value: { type: string, maxLength: 4096 }
        - type: object
          required: [conversationId, cancel]
          additionalProperties: false
          properties:
            conversationId: { type: string, minLength: 1, maxLength: 64 }
            cancel: { type: boolean, const: true }
    LoginChallenge:
      type: object
      required: [conversationId, prompts]
      properties:
        conversationId: { type: string }
        prompts:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [id, style, message]
            properties:
              id: { type: string }
              style: { type: string, enum: [hidden, text, info, error] }
              message: { type: string, maxLength: 1024 }
    Problem:
      type: object
      required: [title, status, code]
      properties:
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
    MetricSample:
      type: object
      required: [timestamp, cpuPercent, memoryUsed, memoryTotal, networkRx, networkTx, diskRead, diskWrite]
      properties:
        timestamp: { type: string, format: date-time }
        cpuPercent: { type: number }
        cpuCorePercent: { type: array, items: { type: number } }
        memoryUsed: { type: integer }
        memoryTotal: { type: integer }
        swapUsed: { type: integer }
        swapTotal: { type: integer }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        networkRx: { type: integer }
        networkTx: { type: integer }
        diskRead: { type: integer }
        diskWrite: { type: integer }
  responses:
    Problem:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
