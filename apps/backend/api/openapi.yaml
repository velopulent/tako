    AdministrativeRolePreview:
      type: object
      required: [action, username, role, current, changes, warnings, stale, allowed, requiresConfirmation]
      properties:
        action: { type: string, enum: [grant, revoke] }
        username: { type: string, maxLength: 32 }
        role: { type: string, enum: [administrator] }
        current: { $ref: '#/components/schemas/AdministrativeRoleState' }
        changes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
        warnings:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 512 }
        stale: { type: boolean }
        allowed: { type: boolean }
        reason: { type: string, maxLength: 512 }
        requiresConfirmation: { type: boolean }
    ProcessSocket:
      type: object
      required: [protocol, local]
      properties:
        protocol: { type: string, maxLength: 8 }
        local: { type: string, maxLength: 256 }
        remote: { type: string, maxLength: 256 }
        state: { type: string, maxLength: 16 }
    ProcessResourceSample:
      type: object
      required: [timestamp, cpuTime, memory, virtualMemory, diskRead, diskWrite]
      properties:
        timestamp: { type: string, format: date-time }
        cpuTime: { type: number, minimum: 0 }
        memory: { type: integer, minimum: 0 }
        virtualMemory: { type: integer, minimum: 0 }
        diskRead: { type: integer, minimum: 0 }
        diskWrite: { type: integer, minimum: 0 }
    ProcessDetails:
      type: object
      required: [process, children, openFiles, sockets, history]
      properties:
        process: { $ref: '#/components/schemas/ProcessInfo' }
        parent: { $ref: '#/components/schemas/ProcessInfo' }
        children:
          type: array
          maxItems: 2048
          items: { $ref: '#/components/schemas/ProcessInfo' }
        cgroup: { type: string, maxLength: 65536 }
        openFiles:
          type: array
          maxItems: 256
          items: { type: string, maxLength: 4096 }
        sockets:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/ProcessSocket' }
        history:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/ProcessResourceSample' }
        accessIssues:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
    ProcessTarget:
      type: object
      required: [pid, started]
      additionalProperties: false
      properties:
        pid: { type: integer, minimum: 1 }
        started: { type: integer, minimum: 1 }
    ProcessSignalRequest:
      type: object
      required: [signal, started]
      additionalProperties: false
      properties:
        signal: { type: string, enum: [HUP, INT, TERM, KILL, STOP, CONT, USR1, USR2] }
        tree: { type: boolean, default: false }
        started: { type: integer, minimum: 1 }
    ProcessSignalApplyRequest:
      allOf:
        - $ref: '#/components/schemas/ProcessSignalRequest'
        - type: object
          required: [expectedTargets]
          properties:
            expectedTargets:
              type: array
              minItems: 1
              maxItems: 1024
              items: { $ref: '#/components/schemas/ProcessTarget' }
    SignalTarget:
      allOf:
        - $ref: '#/components/schemas/ProcessTarget'
        - type: object
          required: [uid, user, program]
          properties:
            uid: { type: integer, minimum: 0 }
            user: { type: string }
            program: { type: string }
    SignalPreview:
      type: object
      required: [signal, tree, targets, fingerprint]
      properties:
        signal: { type: string }
        tree: { type: boolean }
        targets:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/SignalTarget' }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
    SignalResult:
      type: object
      required: [signal, tree, targets, signaled]
      properties:
        signal: { type: string }
        tree: { type: boolean }
        targets:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/SignalTarget' }
        signaled:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/SignalTarget' }
        failures:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [pid, error]
            properties:
              pid: { type: integer, minimum: 1 }
              error: { type: string, maxLength: 128 }
    MetricSample:
      type: object
      required: [timestamp, cpuPercent, memoryUsed, memoryTotal, networkRx, networkTx, diskRead, diskWrite]
      properties:
        timestamp: { type: string, format: date-time }
        cpuPercent: { type: number }
        cpuCorePercent: { type: array, items: { type: number } }
        memoryUsed: { type: integer }
        memoryTotal: { type: integer }
        swapUsed: { type: integer }
        swapTotal: { type: integer }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        networkRx: { type: integer }
        networkTx: { type: integer }
        diskRead: { type: integer }
        diskWrite: { type: integer }
  responses:
    Problem:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
