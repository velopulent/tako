        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /firewall/preview:
    post:
      operationId: previewFirewallOperation
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/FirewallOperation' } }
      responses:
        '200': { description: Current firewall runtime and persistence state, content: { application/json: { schema: { $ref: '#/components/schemas/FirewallState' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /security:
    get:
