    ServiceOverrideOperation:
      type: object
      additionalProperties: false
      required: [action, scope, unit]
      properties:
        action: { type: string, enum: [preview, apply, delete] }
        scope: { type: string, enum: [system, user] }
        unit: { type: string, maxLength: 256, pattern: '^[A-Za-z0-9@._-]+\.service$' }
        environment:
          type: object
          maxProperties: 64
          additionalProperties: { type: string, maxLength: 4096 }
        restart: { type: string, enum: [no, on-success, on-failure, on-abnormal, on-watchdog, on-abort, always] }
        restartSec: { type: string, maxLength: 64 }
        timeoutStartSec: { type: string, maxLength: 64 }
        timeoutStopSec: { type: string, maxLength: 64 }
        nice: { type: integer, minimum: -20, maximum: 19 }
        cpuQuota: { type: string, pattern: '^[0-9]+(\.[0-9]+)?%$' }
        memoryMax: { type: string, maxLength: 32 }
        tasksMax: { type: integer, minimum: 1, maximum: 1000000 }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-fA-F0-9]{64}$' }
    ServiceOverrideState:
      type: object
      required: [scope, unit, path, exists, guidance]
      properties:
        scope: { type: string, enum: [system, user] }
        unit: { type: string, maxLength: 256 }
        path: { type: string, maxLength: 4096 }
        exists: { type: boolean }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        definition: { $ref: '#/components/schemas/ServiceOverrideDefinition' }
        guidance:
          type: array
          maxItems: 4
          items: { type: string, maxLength: 512 }
    ServiceOverrideDefinition:
      type: object
      properties:
        environment: { type: object, additionalProperties: { type: string, maxLength: 4096 } }
        restart: { type: string }
        restartSec: { type: string }
        timeoutStartSec: { type: string }
        timeoutStopSec: { type: string }
        nice: { type: integer }
        cpuQuota: { type: string }
        memoryMax: { type: string }
        tasksMax: { type: integer }
    LoginRequest:
      oneOf:
        - type: object
          required: [username]
          additionalProperties: false
          properties:
            username: { type: string, minLength: 1, maxLength: 256 }
            password: { type: string, maxLength: 4096 }
        - type: object
          required: [conversationId, responses]
          additionalProperties: false
          properties:
            conversationId: { type: string, minLength: 1, maxLength: 64 }
            responses:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                required: [id, value]
                additionalProperties: false
                properties:
                  id: { type: string, minLength: 1, maxLength: 64 }
                  value: { type: string, maxLength: 4096 }
        - type: object
          required: [conversationId, cancel]
          additionalProperties: false
          properties:
            conversationId: { type: string, minLength: 1, maxLength: 64 }
            cancel: { type: boolean, const: true }
    LoginChallenge:
      type: object
      required: [conversationId, prompts]
      properties:
        conversationId: { type: string }
        prompts:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [id, style, message]
            properties:
              id: { type: string }
              style: { type: string, enum: [hidden, text, info, error] }
              message: { type: string, maxLength: 1024 }
    Problem:
      type: object
      required: [title, status, code]
      description: API problem. Host-backed routes use stable authority codes for execution-lane failures.
      properties:
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Module-specific code or one of the stable HostAuthorityErrorCode values.
        detail: { type: string }
    HostAuthorityErrorCode:
      type: string
      description: Stable error codes returned when a host execution lane cannot complete an operation.
      enum: [permission-denied, user-manager-unavailable, system-backend-unavailable, timeout, bounded-output, conflict]
    JournalPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/JournalEntry' }
        nextCursor: { type: string, maxLength: 8192 }
    JournalEntry:
      type: object
      required: [id, timestamp, priority, unit, message]
      properties:
        id: { type: string, maxLength: 128 }
        timestamp: { type: string, format: date-time }
        priority: { type: string, maxLength: 2 }
        unit: { type: string, maxLength: 256 }
        message: { type: string, maxLength: 1048576 }
        details:
          type: object
          additionalProperties: { type: string, maxLength: 16384 }
    LoginHistoryIdentity:
      type: object
      required: [username, source, present]
      properties:
        username: { type: string, maxLength: 256 }
        source: { type: string, enum: [local, nss-read-only, deleted-unknown] }
        present: { type: boolean }
    LoginHistoryEntry:
      type: object
      required: [timestamp, event, outcome, service]
      properties:
        timestamp: { type: string, format: date-time }
        event: { type: string, enum: [login, session-open, session-close] }
        outcome: { type: string, enum: [success, failure] }
        service: { type: string, maxLength: 128 }
        remote: { type: string, maxLength: 256 }
        session: { type: string, maxLength: 128 }
    LoginHistoryPage:
      type: object
      required: [identity, items]
      properties:
        identity: { $ref: '#/components/schemas/LoginHistoryIdentity' }
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/LoginHistoryEntry' }
        nextCursor: { type: string, maxLength: 8192 }
    ProcessInfo:
      type: object
      required: [pid, ppid, started, uid, user, program, command, state, threads, cpuTime, memory, virtualMemory, diskRead, diskWrite]
      properties:
        pid: { type: integer, minimum: 1 }
        ppid: { type: integer, minimum: 0 }
        started: { type: integer, minimum: 0, description: Linux process start ticks; zero means metadata was restricted }
        uid: { type: integer, minimum: 0 }
        user: { type: string }
        program: { type: string }
        command: { type: string, maxLength: 16384 }
        state: { type: string, maxLength: 1 }
        threads: { type: integer, minimum: 0 }
        cpuTime: { type: number, minimum: 0 }
        memory: { type: integer, minimum: 0 }
        virtualMemory: { type: integer, minimum: 0 }
        diskRead:
          type: integer
          minimum: 0
          description: Cumulative bytes read; meaningless zeros when ioDenied is true
        diskWrite:
          type: integer
          minimum: 0
          description: Cumulative bytes written; meaningless zeros when ioDenied is true
        ioDenied:
          type: boolean
          description: True when the server lacks read access to the process's I/O counters
        permissionDenied: { type: boolean }
        reason: { type: string, maxLength: 256 }
    NSSUser:
      type: object
      required: [username, uid, gid, name, home, shell, system, groups, source, local, mutable]
      properties:
        username: { type: string, maxLength: 256 }
        uid: { type: integer, minimum: 0 }
        gid: { type: integer, minimum: 0 }
        name: { type: string, maxLength: 1024 }
        home: { type: string, maxLength: 4096 }
        shell: { type: string, maxLength: 4096 }
        system: { type: boolean }
        groups:
          type: array
          maxItems: 4096
          items: { type: string, maxLength: 256 }
        source: { type: string, enum: [local, nss-read-only] }
        local: { type: boolean }
        mutable: { type: boolean }
        reason: { type: string, maxLength: 512 }
    NSSGroup:
      type: object
      required: [name, gid, members, source, local, mutable]
      properties:
        name: { type: string, maxLength: 256 }
        gid: { type: integer, minimum: 0 }
        members:
          type: array
          maxItems: 4096
          items: { type: string, maxLength: 256 }
        source: { type: string, enum: [local, nss-read-only] }
        local: { type: boolean }
        mutable: { type: boolean }
        reason: { type: string, maxLength: 512 }
    LocalAccountOperation:
      type: object
      required: [action, username]
      additionalProperties: false
      properties:
        action: { type: string, enum: [create, update, lock, unlock, delete] }
        username: { type: string, minLength: 1, maxLength: 32 }
        name: { type: string, maxLength: 256 }
        home: { type: string, maxLength: 4096 }
        shell: { type: string, maxLength: 4096 }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
        confirmation: { type: string, maxLength: 64 }
    LocalAccountState:
      type: object
      required: [username, exists, locked, fingerprint]
      properties:
        username: { type: string, maxLength: 32 }
        exists: { type: boolean }
        user: { $ref: '#/components/schemas/NSSUser' }
        locked: { type: boolean }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        source: { type: string, enum: [local, nss-read-only] }
    LocalAccountPreview:
      type: object
      required: [action, username, current, changes, warnings, stale, allowed, requiresConfirmation]
      properties:
        action: { type: string, enum: [create, update, lock, unlock, delete] }
        username: { type: string, maxLength: 32 }
        current: { $ref: '#/components/schemas/LocalAccountState' }
        changes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
        warnings:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 512 }
        stale: { type: boolean }
        allowed: { type: boolean }
        reason: { type: string, maxLength: 512 }
        requiresConfirmation: { type: boolean }
    PasswordChangeOperation:
      oneOf:
        - type: object
          required: [action, currentPassword, newPassword, confirmation]
          additionalProperties: false
          properties:
            action: { type: string, enum: [change] }
            currentPassword: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
            newPassword: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
            confirmation: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        - type: object
          required: [action, username, newPassword, confirmation]
          additionalProperties: false
          properties:
            action: { type: string, enum: [reset] }
            username: { type: string, minLength: 1, maxLength: 32, pattern: '^[a-z_][a-z0-9_$-]*$' }
            newPassword: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
            confirmation: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    SSHKeyOperation:
      type: object
      additionalProperties: false
      required: [action, username]
      properties:
        action: { type: string, enum: [add, remove] }
        username: { type: string, minLength: 1, maxLength: 32, pattern: '^[a-z_][a-z0-9_$-]*$' }
        key: { type: string, maxLength: 12288, writeOnly: true }
        fingerprint: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-fA-F0-9]{64}$' }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-fA-F0-9]{64}$' }
        confirmation: { type: string, maxLength: 128, writeOnly: true }
    SSHKey:
      type: object
      required: [fingerprint, type, line]
      properties:
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        type: { type: string, maxLength: 128 }
        comment: { type: string, maxLength: 1024 }
        line: { type: string, maxLength: 16384 }
    SSHKeyState:
      type: object
      required: [username, path, fingerprint, keys, writable, authority]
      properties:
        username: { type: string, maxLength: 32 }
        path: { type: string, maxLength: 4096 }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        keys:
          type: array
          maxItems: 2048
          items: { $ref: '#/components/schemas/SSHKey' }
        writable: { type: boolean }
        authority: { type: string, enum: [user, administrative] }
        reason: { type: string, maxLength: 512 }
    SSHKeyPreview:
      type: object
      required: [action, username, current, changes, warnings, stale, allowed, requiresConfirmation]
      properties:
        action: { type: string, enum: [add, remove] }
        username: { type: string, maxLength: 32 }
        current: { $ref: '#/components/schemas/SSHKeyState' }
        changes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
        warnings:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 512 }
        stale: { type: boolean }
        allowed: { type: boolean }
        reason: { type: string, maxLength: 512 }
        requiresConfirmation: { type: boolean }
    GroupMembershipOperation:
      type: object
      required: [action, username, group]
      additionalProperties: false
      properties:
        action: { type: string, enum: [add, remove] }
        username: { type: string, minLength: 1, maxLength: 32 }
        group: { type: string, minLength: 1, maxLength: 256 }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
    GroupMembershipState:
      type: object
      required: [username, group, member, fingerprint]
      properties:
        username: { type: string, maxLength: 32 }
        group: { $ref: '#/components/schemas/NSSGroup' }
        member: { type: boolean }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
    GroupMembershipPreview:
      type: object
      required: [action, username, group, current, changes, warnings, stale, allowed, requiresConfirmation]
      properties:
        action: { type: string, enum: [add, remove] }
        username: { type: string, maxLength: 32 }
        group: { type: string, maxLength: 256 }
        current: { $ref: '#/components/schemas/GroupMembershipState' }
        changes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
        warnings:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 512 }
        stale: { type: boolean }
        allowed: { type: boolean }
        reason: { type: string, maxLength: 512 }
        requiresConfirmation: { type: boolean }
    AdministrativeRoleOperation:
      type: object
      required: [action, username, role]
      additionalProperties: false
      properties:
        action: { type: string, enum: [grant, revoke] }
        username: { type: string, minLength: 1, maxLength: 32 }
        role: { type: string, enum: [administrator] }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
        confirmation: { type: string, maxLength: 128 }
    AdministrativeRoleState:
      type: object
      required: [username, role, group, member, members, fingerprint]
      properties:
        username: { type: string, maxLength: 32 }
        role: { type: string, enum: [administrator] }
        group: { type: string, maxLength: 256 }
        member: { type: boolean }
        members:
          type: array
          maxItems: 4096
          items: { type: string, maxLength: 32 }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
    AdministrativeRolePreview:
      type: object
      required: [action, username, role, current, changes, warnings, stale, allowed, requiresConfirmation]
      properties:
        action: { type: string, enum: [grant, revoke] }
        username: { type: string, maxLength: 32 }
        role: { type: string, enum: [administrator] }
        current: { $ref: '#/components/schemas/AdministrativeRoleState' }
        changes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
        warnings:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 512 }
        stale: { type: boolean }
        allowed: { type: boolean }
        reason: { type: string, maxLength: 512 }
        requiresConfirmation: { type: boolean }
    LocalGroupOperation:
      type: object
      required: [action, group]
      additionalProperties: false
      properties:
        action: { type: string, enum: [create, delete] }
        group: { type: string, minLength: 1, maxLength: 256, pattern: '^[a-z_][a-z0-9_$-]*$' }
        expectedFingerprint: { type: string, minLength: 64, maxLength: 64 }
        confirmation: { type: string, maxLength: 128 }
    LocalGroupState:
      type: object
      required: [group, exists, fingerprint]
      properties:
        group: { type: string, maxLength: 256 }
        exists: { type: boolean }
        groupInfo: { $ref: '#/components/schemas/NSSGroup' }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        source: { type: string, enum: [local, nss-read-only] }
    LocalGroupPreview:
      type: object
      required: [action, group, current, changes, warnings, stale, allowed, requiresConfirmation]
      properties:
        action: { type: string, enum: [create, delete] }
        group: { type: string, maxLength: 256 }
        current: { $ref: '#/components/schemas/LocalGroupState' }
        changes:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
        warnings:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 512 }
        stale: { type: boolean }
        allowed: { type: boolean }
        reason: { type: string, maxLength: 512 }
        requiresConfirmation: { type: boolean }
    ProcessSocket:
      type: object
      required: [protocol, local]
      properties:
        protocol: { type: string, maxLength: 8 }
        local: { type: string, maxLength: 256 }
        remote: { type: string, maxLength: 256 }
        state: { type: string, maxLength: 16 }
    ProcessResourceSample:
      type: object
      required: [timestamp, cpuTime, memory, virtualMemory, diskRead, diskWrite]
      properties:
        timestamp: { type: string, format: date-time }
        cpuTime: { type: number, minimum: 0 }
        memory: { type: integer, minimum: 0 }
        virtualMemory: { type: integer, minimum: 0 }
        diskRead: { type: integer, minimum: 0 }
        diskWrite: { type: integer, minimum: 0 }
        ioDenied:
          type: boolean
          description: True when the server could not read this process's I/O counters; diskRead and diskWrite are then meaningless zeros
    ProcessDetails:
      type: object
      required: [process, children, openFiles, sockets, history]
      properties:
        process: { $ref: '#/components/schemas/ProcessInfo' }
        parent: { $ref: '#/components/schemas/ProcessInfo' }
        children:
          type: array
          maxItems: 2048
          items: { $ref: '#/components/schemas/ProcessInfo' }
        cgroup: { type: string, maxLength: 65536 }
        openFiles:
          type: array
          maxItems: 256
          items: { type: string, maxLength: 4096 }
        sockets:
          type: array
          maxItems: 256
          items: { $ref: '#/components/schemas/ProcessSocket' }
        history:
          type: array
          maxItems: 120
          items: { $ref: '#/components/schemas/ProcessResourceSample' }
        accessIssues:
          type: array
          maxItems: 16
          items: { type: string, maxLength: 256 }
    ProcessTarget:
      type: object
      required: [pid, started]
      additionalProperties: false
      properties:
        pid: { type: integer, minimum: 1 }
        started: { type: integer, minimum: 1 }
    ProcessSignalRequest:
      type: object
      required: [signal, started]
      additionalProperties: false
      properties:
        signal: { type: string, enum: [HUP, INT, TERM, KILL, STOP, CONT, USR1, USR2] }
        tree: { type: boolean, default: false }
        started: { type: integer, minimum: 1 }
    ProcessSignalApplyRequest:
      allOf:
        - $ref: '#/components/schemas/ProcessSignalRequest'
        - type: object
          required: [expectedTargets]
          properties:
            expectedTargets:
              type: array
              minItems: 1
              maxItems: 1024
              items: { $ref: '#/components/schemas/ProcessTarget' }
    SignalTarget:
      allOf:
        - $ref: '#/components/schemas/ProcessTarget'
        - type: object
          required: [uid, user, program]
          properties:
            uid: { type: integer, minimum: 0 }
            user: { type: string }
            program: { type: string }
    SignalPreview:
      type: object
      required: [signal, tree, targets, fingerprint]
      properties:
        signal: { type: string }
        tree: { type: boolean }
        targets:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/SignalTarget' }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
    SignalResult:
      type: object
      required: [signal, tree, targets, signaled]
      properties:
        signal: { type: string }
        tree: { type: boolean }
        targets:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/SignalTarget' }
        signaled:
          type: array
          maxItems: 1024
          items: { $ref: '#/components/schemas/SignalTarget' }
        failures:
          type: array
          maxItems: 1024
          items:
            type: object
            required: [pid, error]
            properties:
              pid: { type: integer, minimum: 1 }
              error: { type: string, maxLength: 128 }
    MetricSample:
      type: object
      required: [timestamp, cpuPercent, memoryUsed, memoryTotal, networkRx, networkTx, diskRead, diskWrite]
      properties:
        timestamp: { type: string, format: date-time }
        cpuPercent: { type: number }
        cpuCorePercent: { type: array, items: { type: number } }
        memoryUsed: { type: integer }
        memoryTotal: { type: integer }
        swapUsed: { type: integer }
        swapTotal: { type: integer }
        load1: { type: number }
        load5: { type: number }
        load15: { type: number }
        networkRx: { type: integer }
        networkTx: { type: integer }
        diskRead:
          type: integer
          minimum: 0
          description: Cumulative bytes read across whole physical disks; partitions and virtual devices are excluded
        diskWrite:
          type: integer
          minimum: 0
          description: Cumulative bytes written across whole physical disks; partitions and virtual devices are excluded
        disks:
          type: object
          description: Per-disk cumulative byte counters keyed by kernel device name (for example nvme0n1)
          additionalProperties:
            $ref: '#/components/schemas/DiskSample'
    StorageFilesystem:
      type: object
      required: [device, type, majorMinor, network, readOnly, total, used, available, percent, targets]
      description: |
        A distinct mounted filesystem. Bind mounts and btrfs subvolume mounts share one
        superblock device number, so they appear once with multiple targets instead of
        duplicating capacity. Network filesystems carry network=true.
      properties:
        device: { type: string, maxLength: 256 }
        type: { type: string, maxLength: 64 }
        majorMinor:
          type: string
          pattern: '^[0-9]+:[0-9]+$'
          description: Kernel superblock device number in major:minor form
        network: { type: boolean }
        readOnly: { type: boolean }
        total: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        available: { type: integer, minimum: 0 }
        percent: { type: number }
        targets:
          type: array
          maxItems: 4096
          items: { $ref: '#/components/schemas/MountPoint' }
    StoragePartition:
      type: object
      required: [path, size, readOnly, mountPoints]
      properties:
        path: { type: string, maxLength: 256 }
        name: { type: string, maxLength: 256 }
        size: { type: integer, minimum: 0 }
        filesystem: { type: string, maxLength: 64 }
        label: { type: string, maxLength: 256 }
        uuid: { type: string, maxLength: 128 }
        parent: { type: string, maxLength: 256 }
        readOnly: { type: boolean }
        mountPoints: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/MountPoint' } }
    StorageHealth:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        passed: { type: boolean }
        temperatureC: { type: integer }
        powerOnHours: { type: integer, minimum: 0 }
        failing: { type: boolean }
        reason: { type: string, maxLength: 512 }
    NVMeHealth:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        temperatureC: { type: integer }
        percentageUsed: { type: integer, minimum: 0, maximum: 255 }
        criticalWarning: { type: integer, minimum: 0, maximum: 255 }
        reason: { type: string, maxLength: 512 }
    StorageDevice:
      type: object
      required: [path, name, type, size, readOnly, removable, partitions]
      properties:
        path: { type: string, maxLength: 256 }
        name: { type: string, maxLength: 256 }
        type: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 512 }
        serial: { type: string, maxLength: 512 }
        transport: { type: string, maxLength: 64 }
        size: { type: integer, minimum: 0 }
        readOnly: { type: boolean }
        removable: { type: boolean }
        partitions: { type: array, maxItems: 128, items: { $ref: '#/components/schemas/StoragePartition' } }
        smart: { $ref: '#/components/schemas/StorageHealth' }
        nvme: { $ref: '#/components/schemas/NVMeHealth' }
    StorageSnapshot:
      type: object
      required: [filesystems, devices, fingerprint, readOnly]
      properties:
        filesystems: { type: array, maxItems: 4096, items: { $ref: '#/components/schemas/StorageFilesystem' } }
        devices: { type: array, maxItems: 256, items: { $ref: '#/components/schemas/StorageDevice' } }
        fingerprint: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        readOnly: { type: boolean }
        reason: { type: string, maxLength: 512 }
    StorageOperation:
      type: object
      additionalProperties: false
      required: [action, device]
      properties:
        action: { type: string, enum: [preview, mount, unmount, persistent-mount, persistent-unmount] }
        device: { type: string, pattern: '^/dev/[A-Za-z0-9._/@+-]+$' }
        target: { type: string, maxLength: 4096 }
        filesystem: { type: string, maxLength: 64 }
        options: { type: array, maxItems: 32, items: { type: string, maxLength: 128 } }
        expectedFingerprint: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
        confirmation: { type: string, maxLength: 128 }
    StorageState:
      type: object
      required: [snapshot, action, applied]
      properties:
        snapshot: { $ref: '#/components/schemas/StorageSnapshot' }
        action: { type: string }
        applied: { type: boolean }
        warning: { type: string, maxLength: 1024 }
    MountPoint:
      type: object
      required: [target]
      properties:
        target: { type: string, maxLength: 4096 }
        root: { type: string, maxLength: 4096, description: Path of the mount inside its filesystem (bind or btrfs subvolume source) }
        readOnly: { type: boolean }
    StorageSummary:
      type: object
      required: [filesystems, total, used, percent]
      description: Aggregate capacity over unique filesystems only; overlapping mounts never double count
      properties:
        filesystems: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        percent: { type: number }
    DiskSample:
      type: object
      required: [read, write]
      properties:
        read: { type: integer, minimum: 0 }
        write: { type: integer, minimum: 0 }
  responses:
    Problem:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
