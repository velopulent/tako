  /security/preview:
    post:
      operationId: previewSecurityOperation
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SecurityOperation' } }
      responses:
        '200': { description: Current security policy state and bounded findings }
