[server]
address = ":9090"
data_dir = "/var/lib/tako"
session_socket = "/run/tako/session.sock"
# Omit to allow same-origin access at the current URL, including a server IP or hostname.
# Set exact scheme/host/port values for alternate origins or a reverse proxy.
# allowed_origin = "https://console.example.com"
# certificate = "/etc/tako/tako.crt"
# certificate_key = "/etc/tako/tako.key"

[monitoring]
default_interval = "1m"
history_retention = "24h"

[admin]
idle_timeout = "5m"
